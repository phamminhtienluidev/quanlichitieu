<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center">
<!-- TopAppBar Fragment (Transactional: No Nav, simplified for Focus) -->
<header class="fixed top-0 w-full z-50 bg-neutral-50/85 dark:bg-neutral-900/85 backdrop-blur-xl flex justify-between items-center px-6 h-16">
<div class="flex items-center gap-2">
<span class="text-lg font-black tracking-tighter text-black dark:text-white">ATELIER</span>
</div>
<div class="flex items-center">
<span class="font-sans uppercase tracking-[0.2em] text-[0.6875rem] font-medium text-neutral-400">Step 01 / 01</span>
</div>
</header>
<main class="flex-grow w-full max-w-md px-6 pt-32 pb-20 flex flex-col">
<!-- Hero Section -->
<div class="mb-12">
<h1 class="text-[3.5rem] leading-[1.1] font-extrabold tracking-tighter text-on-surface mb-4">Join the Atelier</h1>
<p class="text-secondary text-[0.875rem] leading-relaxed max-w-[280px]">Begin your journey towards financial precision.</p>
</div>
<!-- Form Section -->
<form class="space-y-10">
<!-- Full Name -->
<div class="group">
<label class="block font-sans uppercase tracking-[0.2em] text-[0.6875rem] font-medium text-on-surface-variant mb-2">Full Name</label>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b-2 border-primary focus:ring-0 focus:border-primary placeholder:text-surface-container-high text-lg font-medium transition-colors p-0 pb-2" placeholder="ALEXANDER VOGUE" type="text"/>
</div>
<!-- Email Address -->
<div class="group">
<label class="block font-sans uppercase tracking-[0.2em] text-[0.6875rem] font-medium text-on-surface-variant mb-2">Email Address</label>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b-2 border-outline-variant focus:ring-0 focus:border-primary placeholder:text-surface-container-high text-lg font-medium transition-colors p-0 pb-2" placeholder="ARCHITECT@MONO.CO" type="email"/>
</div>
<!-- Password -->
<div class="group relative">
<label class="block font-sans uppercase tracking-[0.2em] text-[0.6875rem] font-medium text-on-surface-variant mb-2">Password</label>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b-2 border-outline-variant focus:ring-0 focus:border-primary placeholder:text-surface-container-high text-lg font-medium transition-colors p-0 pb-2" placeholder="••••••••" type="password"/>
<button class="absolute right-0 bottom-2 text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-sm">visibility</span>
</button>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full h-14 bg-primary text-on-primary rounded-lg font-bold text-[0.875rem] uppercase tracking-widest hover:opacity-90 active:scale-95 transition-all shadow-xl shadow-black/5" type="submit">
                    Create Account
                </button>
</div>
</form>
<!-- Divider -->
<div class="relative my-12 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant opacity-20"></div>
</div>
<span class="relative bg-surface px-4 font-sans uppercase tracking-[0.2em] text-[0.6rem] font-bold text-outline">or connect via</span>
</div>
<!-- Alternative Auth -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center h-14 bg-surface-container-high rounded-lg hover:bg-surface-dim transition-colors active:scale-95">
<div class="flex items-center gap-2">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M12.48 10.92v3.28h7.84c-.24 1.84-.91 3.22-1.91 4.22c-1.23 1.23-3.15 2.57-7.85 2.57c-7.31 0-13.07-5.93-13.07-13.24s5.76-13.24 13.07-13.24c4.01 0 7.07 1.58 9.3 3.66l2.32-2.32C19.21 3.01 16.24 1 12.48 1c-6.62 0-12 5.38-12 12s5.38 12 12 12c3.58 0 6.28-1.18 8.4-3.4c2.18-2.18 2.87-5.26 2.87-7.7c0-.52-.04-1.01-.12-1.46z" fill="currentColor"></path>
</svg>
<span class="font-bold text-[0.75rem] uppercase tracking-wider">Google</span>
</div>
</button>
<button class="flex items-center justify-center h-14 bg-surface-container-high rounded-lg hover:bg-surface-dim transition-colors active:scale-95">
<div class="flex items-center gap-2">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.22 1.72-3.71 1.72c-1.47 0-2.25-.86-3.74-.86c-1.5 0-2.39.84-3.71.84c-1.5 0-2.98-1.03-4.14-2.82c-2.33-3.64-1.78-8.99.71-11.02c1.24-1.01 2.61-1.57 3.94-1.57c1.47 0 2.37.86 3.73.86c1.36 0 2.05-.86 3.71-.86c1.11 0 2.38.4 3.4 1.23c-2.45 1.4-2.03 5.09.43 6.13c-.56 1.39-1.28 2.76-1.92 3.49M13.2 2.34c0 1.63-1.34 3.42-3.13 3.42c-.14 0-.28-.01-.39-.03c-.02-1.76 1.41-3.52 3.01-3.52c.18 0 .34.01.51.03c.01.03.01.07.01.1z" fill="currentColor"></path>
</svg>
<span class="font-bold text-[0.75rem] uppercase tracking-wider">Apple</span>
</div>
</button>
</div>
<!-- Footer Link -->
<div class="mt-auto pt-12 text-center">
<p class="text-on-surface-variant text-[0.875rem]">
                Already an artisan? 
                <a class="text-primary font-bold underline underline-offset-4 decoration-outline-variant hover:decoration-primary transition-all ml-1" href="#">Sign In</a>
</p>
</div>
</main>
<!-- Decorative Corner Element (Design System: Intentional Asymmetry) -->
<div class="fixed bottom-[-10%] right-[-5%] w-64 h-64 bg-surface-container-high rounded-full opacity-30 blur-[80px] pointer-events-none"></div>
<!-- Legal Anchor -->
<footer class="w-full max-w-md px-6 pb-8 text-center">
<p class="font-sans uppercase tracking-[0.2em] text-[0.6rem] font-medium text-neutral-400 leading-loose">
            By creating an account, you agree to our <br/>
<span class="text-on-surface border-b border-outline-variant">Terms of Service</span> &amp; <span class="text-on-surface border-b border-outline-variant">Privacy Architecture</span>
</p>
</footer>
<!-- Image Context (Abstract Background Texture) -->
<div class="fixed inset-0 -z-10 bg-noise opacity-[0.03] pointer-events-none"></div>
<div class="fixed inset-0 -z-20 bg-surface"></div>
</body></html>
